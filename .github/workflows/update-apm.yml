name: Update apm

# Checks apmjs.dev for a newer apm CLI release and updates Formula/apm.rb once the new
# formula installs and passes brew test on macOS arm64 and x64 and Linux x64 and arm64.
# apmjs's release-cli.ts starts it after each production CLI release (gh workflow run with
# version=<x.y.z>). It also runs on demand, or on repository_dispatch type "apm-release"
# (optional client_payload.version).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pin (blank = newest stable release)"
        required: false
  repository_dispatch:
    types: [apm-release]

permissions:
  contents: read

concurrency:
  group: update-apm
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the formula
        env:
          VERSION: ${{ inputs.version || github.event.client_payload.version || '' }}
        run: scripts/update-apm.sh "$VERSION"
      - name: Check for a change
        id: diff
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          git diff
      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: formula
          path: Formula/apm.rb

  test:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: Formula
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
      - name: Install and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          tap="$(brew --repository)/Library/Taps/opencoredev"
          mkdir -p "$tap"
          rm -rf "$tap/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$tap/homebrew-tap"
          brew install opencoredev/tap/apm
          brew test opencoredev/tap/apm
          test "$(apm --version)" = "$(awk -F'"' '/^  version /{ print $2 }' Formula/apm.rb)"
          file "$(brew --prefix)/bin/apm" || true

  push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: Formula
      - name: Commit
        run: |
          version=$(awk -F'"' '/^  version /{ print $2 }' Formula/apm.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "apm $version"
          git push
